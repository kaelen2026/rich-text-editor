<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>富文本编辑器 · S1 最小可编辑闭环</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 900px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .hint {
        font-size: 13px;
        opacity: 0.7;
        margin: 0 0 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .toolbar button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .toolbar button[data-active="true"] {
        background: currentColor;
        color: Canvas;
      }
      .toolbar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .status {
        font-size: 12px;
        opacity: 0.7;
        margin-left: auto;
      }
      .surface {
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 6px;
        padding: 12px 16px;
        min-height: 160px;
      }
      .ProseMirror {
        outline: none;
        line-height: 1.7;
      }
      .ProseMirror p {
        margin: 0 0 0.75em;
      }
      .warning {
        font-size: 13px;
        border: 1px solid rgba(200, 140, 0, 0.6);
        background: rgba(200, 140, 0, 0.1);
        border-radius: 6px;
        padding: 8px 12px;
        margin: 0 0 12px;
      }
      .co-unknown {
        display: inline-block;
        border: 1px dashed rgba(128, 128, 128, 0.7);
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 13px;
        opacity: 0.75;
        user-select: all;
      }
      div.co-unknown {
        display: block;
        margin: 0 0 0.75em;
      }
      pre {
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 6px;
        padding: 12px;
        overflow-x: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
