name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check 里含：序列化函数禁 DOM、包间依赖方向、公开 API 表面快照、Biome。
      - name: Check formatting and lint rules
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # 浏览器包每次下载约 95MB。按 lockfile 缓存：Playwright 版本一变，键就变。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # 只跑 jsdom 验不了的两类：输入法组合态与粘贴解析阶段的网络请求数。
      - name: Run browser acceptance
        run: pnpm e2e

      - name: Enforce performance budget
        run: pnpm bench

      - name: Validate commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
